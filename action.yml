name: Bun Dependency Submission
description: Submit the dependencies in your bun.lock to GitHub's dependency graph, so Dependabot alerts follow what Bun really installs.
author: polvallverdu
branding:
  icon: package
  color: orange

inputs:
  lockfile:
    description: Path to the text lockfile (`bun.lock`), relative to `working-directory`.
    required: false
    default: bun.lock
  working-directory:
    description: Folder the lockfile lives in, relative to the repository root. Manifest paths are reported relative to the repository root.
    required: false
    default: .
  token:
    description: "Token used to submit the snapshot. Needs `contents: write`."
    required: false
    default: ${{ github.token }}
  dry-run:
    description: Build the snapshot and write it to a file, but don't submit it.
    required: false
    default: "false"
  exclude-dev:
    description: Leave out packages that only `devDependencies` reach.
    required: false
    default: "false"
  correlator:
    description: |
      Groups snapshots: a new one replaces the last one with the same correlator.
      Defaults to the workflow, the job and the lockfile path, so each lockfile keeps its own.
    required: false
    default: ""
  bun-version:
    description: Bun version to install when the job doesn't already have Bun on its PATH.
    required: false
    default: latest

outputs:
  snapshot-id:
    description: The id GitHub gave the snapshot (empty on a dry run).
    value: ${{ steps.submit.outputs.snapshot-id }}
  snapshot-file:
    description: Path to the snapshot JSON that was built (and submitted, unless it was a dry run).
    value: ${{ steps.submit.outputs.snapshot-file }}
  manifests:
    description: Number of manifests (workspace package.json files) in the snapshot.
    value: ${{ steps.submit.outputs.manifests }}
  packages:
    description: Number of distinct packages (name and version) in the snapshot.
    value: ${{ steps.submit.outputs.packages }}

runs:
  using: composite
  steps:
    - id: bun
      shell: bash
      run: |
        if command -v bun >/dev/null 2>&1; then
          echo "found=true" >> "$GITHUB_OUTPUT"
        else
          echo "found=false" >> "$GITHUB_OUTPUT"
        fi

    - if: steps.bun.outputs.found != 'true'
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: ${{ inputs.bun-version }}

    - id: submit
      shell: bash
      env:
        LOCKFILE: ${{ inputs.lockfile }}
        WORKING_DIRECTORY: ${{ inputs.working-directory }}
        TOKEN: ${{ inputs.token }}
        DRY_RUN: ${{ inputs.dry-run }}
        EXCLUDE_DEV: ${{ inputs.exclude-dev }}
        CORRELATOR: ${{ inputs.correlator }}
      run: bun "$GITHUB_ACTION_PATH/src/main.ts"
