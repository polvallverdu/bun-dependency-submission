version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci

  # @types/bun and typescript, for the typecheck.
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    groups:
      dev:
        patterns: ["*"]
    commit-message:
      prefix: chore
